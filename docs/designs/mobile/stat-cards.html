<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390px, initial-scale=1.0" />
  <title>Stat Cards — Big Fly Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Code&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0f13; --surface: #13161c; --surface2: #1a1e27;
      --border: #252934; --text: #e2e8f0; --muted: #6b7280;
      --accent: #3b82f6; --accent2: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
    h1,h2,h3 { font-family: 'Google Sans', sans-serif; }

    .status-bar { height: 44px; background: var(--bg); display: flex; align-items: flex-end; justify-content: space-between; padding: 0 20px 8px; flex-shrink: 0; }
    .sb-time { font-family: 'Google Sans', sans-serif; font-weight: 700; font-size: 0.85rem; color: var(--text); }
    .sb-icons { display: flex; gap: 5px; align-items: center; font-size: 0.7rem; color: var(--text); font-family: 'Google Sans Code', monospace; }

    .app { display: flex; flex-direction: column; height: 100%; min-height: 844px; }

    .app-header { padding: 0 16px; height: 52px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; }
    .app-title { font-family: 'Google Sans', sans-serif; font-size: 1rem; font-weight: 700; color: #f1f5f9; display: flex; align-items: center; gap: 8px; }
    .back-btn { color: var(--accent); font-size: 1.1rem; cursor: pointer; }
    .share-btn { font-size: 0.75rem; padding: 6px 14px; border-radius: 8px; background: var(--accent); color: #fff; font-family: 'Google Sans', sans-serif; font-weight: 500; border: none; cursor: pointer; }

    .content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding-top: 12px; }

    .panel { margin: 0 16px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; width: calc(100% - 32px); }
    .panel-label { font-family: 'Google Sans Code', monospace; font-size: 0.62rem; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

    /* Stat card preview */
    .card-preview { width: calc(100% - 32px); aspect-ratio: 9/16; border-radius: 16px; overflow: hidden; position: relative; margin-bottom: 12px; }
    .card-bg { position: absolute; inset: 0; background: linear-gradient(145deg, #002D62 0%, #001a3a 40%, #0a0c10 100%); }
    .card-pattern { position: absolute; inset: 0; opacity: 0.04; background-image: repeating-linear-gradient(45deg, transparent, transparent 20px, rgba(255,255,255,0.1) 20px, rgba(255,255,255,0.1) 21px); }
    .card-content { position: relative; z-index: 1; padding: 28px 24px; height: 100%; display: flex; flex-direction: column; }

    /* Pixel art avatar */
    .pixel-avatar { width: 96px; height: 96px; border-radius: 12px; background: #1a1e27; border: 2px solid rgba(255,255,255,0.1); margin-bottom: 16px; display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(12, 1fr); overflow: hidden; image-rendering: pixelated; }
    .px { width: 100%; height: 100%; }

    .card-team { font-size: 0.62rem; font-family: 'Google Sans Code', monospace; color: rgba(235,110,31,0.8); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 4px; }
    .card-name { font-family: 'Google Sans', sans-serif; font-size: 1.6rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .card-pos { font-size: 0.72rem; color: rgba(255,255,255,0.5); font-family: 'Google Sans Code', monospace; margin-bottom: 24px; }

    .card-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: auto; }
    .cs-item { }
    .cs-val { font-family: 'Google Sans', sans-serif; font-weight: 700; font-size: 1.3rem; color: #fff; }
    .cs-spark { height: 16px; margin: 4px 0; display: flex; align-items: end; gap: 1px; }
    .cs-bar { width: 4px; background: rgba(235,110,31,0.4); border-radius: 1px; }
    .cs-lbl { font-size: 0.56rem; color: rgba(255,255,255,0.4); font-family: 'Google Sans Code', monospace; text-transform: uppercase; }

    .card-scope { margin-top: 20px; font-size: 0.6rem; color: rgba(255,255,255,0.3); font-family: 'Google Sans Code', monospace; }

    .card-brand { position: absolute; bottom: 20px; right: 24px; font-size: 0.52rem; color: rgba(255,255,255,0.15); font-family: 'Google Sans Code', monospace; text-transform: uppercase; letter-spacing: 0.15em; }

    /* Card customization controls */
    .customize { width: calc(100% - 32px); }
    .ctrl-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .ctrl-label { font-family: 'Google Sans Code', monospace; font-size: 0.6rem; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
    .ctrl-pill { font-size: 0.68rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-family: 'Google Sans Code', monospace; transition: all 0.15s; }
    .ctrl-pill.active { border-color: var(--accent); color: var(--accent); }
    .ctrl-select { font-size: 0.68rem; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); color: var(--muted); background: var(--surface2); font-family: 'Google Sans Code', monospace; }

    .tab-bar { height: 64px; background: var(--surface); border-top: 1px solid var(--border); display: flex; align-items: stretch; flex-shrink: 0; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; }
    .tab-icon { font-size: 1.05rem; color: var(--muted); }
    .tab-label { font-size: 0.6rem; color: var(--muted); font-family: 'Google Sans', sans-serif; }
    .tab-item.active .tab-icon, .tab-item.active .tab-label { color: var(--accent); }
  </style>
</head>
