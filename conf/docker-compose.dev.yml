services:
  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: conf/Dockerfile
    image: baseball-app:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/baseball_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      BASEBALL_DATA_ROOT: /home/app/data
    volumes:
      - data_root:/home/app/data
    expose:
      - "8080"
    command: ["server", "start"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/baseball", "server", "health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  etl:
    build:
      context: ..
      dockerfile: conf/Dockerfile
    image: baseball-app:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/baseball_dev?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      BASEBALL_DATA_ROOT: /home/app/data
      DB_MAX_OPEN_CONNS: 8
      DB_MAX_IDLE_CONNS: 4
      DB_CONN_MAX_LIFETIME: 20m
      DB_CONN_MAX_IDLE_TIME: 5m
      GOMEMLIMIT: 700MiB
      GOMAXPROCS: 1
      ETL_MAX_ACTIVE_JOBS: 1
      ETL_MAX_QUEUED_JOBS: 16
      ETL_MV_WORK_MEM: 16MB
      ETL_MV_MAINTENANCE_WORK_MEM: 64MB
      ETL_MV_MAX_PARALLEL_WORKERS_PER_GATHER: 0
      ETL_MV_JIT: off
    volumes:
      - data_root:/home/app/data
    entrypoint: ["/usr/local/bin/baseball-etl"]
    command: ["worker"]
    healthcheck:
      disable: true
    mem_limit: 900m
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    labels:
      - traefik.enable=false

  postgres:
    image: postgres:17.5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baseball_dev
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_WORK_MEM: 16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  data_root:
