version: "3"

vars:
  BINARY_NAME: baseball
  ETL_BINARY_NAME: baseball-etl
  DEV_BINARY_NAME: baseball-dev
  BUILD_DIR: tmp
  MAIN_PATH: ./cmd/baseball
  ETL_MAIN_PATH: ./cmd/baseball-etl
  DEV_MAIN_PATH: ./cmd/baseball-dev

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build all binaries (CLI, ETL, Dev tools)
    cmds:
      - task: build:cli
      - task: build:etl
      - task: build:dev

  build:cli:
    desc: Build the baseball CLI
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.MAIN_PATH}}
    sources:
      - "**/*.sql"
      - "**/*.go"
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  build:etl:
    desc: Build the baseball ETL CLI
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.ETL_BINARY_NAME}} {{.ETL_MAIN_PATH}}
    sources:
      - "**/*.sql"
      - "**/*.go"
    generates:
      - "{{.BUILD_DIR}}/{{.ETL_BINARY_NAME}}"

  build:dev:
    desc: Build the baseball dev tools CLI
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.DEV_BINARY_NAME}} {{.DEV_MAIN_PATH}}
    sources:
      - "**/*.sql"
      - "**/*.go"
    generates:
      - "{{.BUILD_DIR}}/{{.DEV_BINARY_NAME}}"

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  rebuild:
    desc: Clean and rebuild bins
    cmds:
      - task: clean
      - task: build

  swagger:generate:
    desc: Generate Swagger/OpenAPI documentation
    cmds:
      - go run ./cmd/baseball-dev swagger generate
    sources:
      - "internal/**/*.go"
    generates:
      - "internal/docs/swagger.json"
      - "internal/docs/swagger.yaml"

  swagger:fix:
    desc: Fix generated swagger docs (remove LeftDelim/RightDelim fields)
    cmds:
      - go run ./cmd/baseball-dev swagger fix

  swagger:fmt:
    desc: Format swagger comments
    cmds:
      - go run ./cmd/baseball-dev swagger fmt

  swagger:clean:
    desc: Clean generated swagger files
    cmds:
      - go run ./cmd/baseball-dev swagger clean

  db:migrate:
    desc: Run database migrations
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}} db migrate

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v

  test:hurl:generate:
    desc: Generate Hurl tests from Swagger via baseball-dev
    cmds:
      - go run ./cmd/baseball-dev generate {{.CLI_ARGS}}

  test:hurl:cleanup:
    desc: Remove generated Hurl artifacts/tests via baseball-dev
    cmds:
      - go run ./cmd/baseball-dev cleanup {{.CLI_ARGS}}

  test:hurl:generated:
    desc: Run generated Hurl tests via baseball-dev (requires BASE_URL env var)
    cmds:
      - go run ./cmd/baseball-dev run --host {{env "BASE_URL"}} {{.CLI_ARGS}}

  test:hurl:smoke:
    desc: Run curated smoke Hurl tests (requires BASE_URL env var)
    cmds:
      - hurl --test --variable BASE_URL={{env "BASE_URL"}} test/smoke/*.hurl

  vet:
    desc: Run go vet across all packages
    cmds:
      - go vet ./...

  test:filter:
    desc: "Run tests matching a pattern (usage: task test:filter -- -run
      TestPattern)"
    cmds:
      - go test ./... -v {{.CLI_ARGS}}
      - task: swagger:generate
      - task: rebuild
      - echo ""
      - echo "Rebuild complete! Restart the server to pick up changes"

  dash:dev:
    desc: Start the dashboard dev server (proxies /v1 to localhost:8080)
    cmds:
      - pnpm --dir web dev

  dash:build:
    desc: Build the dashboard as a static SPA
    cmds:
      - pnpm --dir web build

  update:path:
    deps:
      - build:cli
      - build:etl
    desc: Update the PATH to include the build directory for easy CLI access
    cmds:
      - cp {{.BUILD_DIR}}/{{.BINARY_NAME}} /usr/local/bin/{{.BINARY_NAME}}
      - cp {{.BUILD_DIR}}/{{.ETL_BINARY_NAME}} /usr/local/bin/{{.ETL_BINARY_NAME}}
      - echo "✓ Updated PATH with {{.BINARY_NAME}} and {{.ETL_BINARY_NAME}} from {{.BUILD_DIR}}"
