version: "3"

vars:
  BINARY_NAME: baseball
  ETL_BINARY_NAME: baseball-etl
  BUILD_DIR: tmp
  MAIN_PATH: ./cmd/baseball
  ETL_MAIN_PATH: ./cmd/baseball-etl

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  build:
    desc: Build both binaries (CLI and ETL)
    cmds:
      - task: build:cli
      - task: build:etl

  build:cli:
    desc: Build the baseball CLI
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.MAIN_PATH}}
    sources:
      - "**/*.sql"
      - "**/*.go"
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  build:etl:
    desc: Build the baseball ETL CLI
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.ETL_BINARY_NAME}} {{.ETL_MAIN_PATH}}
    sources:
      - "**/*.sql"
      - "**/*.go"
    generates:
      - "{{.BUILD_DIR}}/{{.ETL_BINARY_NAME}}"

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  rebuild:
    desc: Clean and rebuild bins
    cmds:
      - task: clean
      - task: build

  swagger:generate:
    desc: Generate Swagger/OpenAPI documentation
    cmds:
      - swag init --dir ./internal/api --generalInfo server.go --output
        ./internal/docs --parseDependency --parseInternal --md ./internal/api
      - task: swagger:fix
    sources:
      - "internal/**/*.go"
    generates:
      - "internal/docs/swagger.json"
      - "internal/docs/swagger.yaml"

  swagger:fix:
    desc: Fix generated swagger docs (remove LeftDelim/RightDelim fields)
    cmds:
      - |
        # Remove LeftDelim and RightDelim fields from generated docs.go
        # These fields cause build errors due to swag version incompatibility
        if [ -f internal/docs/docs.go ]; then
          sed -i.bak '/LeftDelim:/d; /RightDelim:/d' internal/docs/docs.go && rm -f internal/docs/docs.go.bak
          echo "✓ Fixed swagger docs (removed LeftDelim/RightDelim fields)"
        else
          echo "⚠ internal/docs/docs.go not found, skipping fix"
        fi

  swagger:fmt:
    desc: Format swagger comments
    cmds:
      - swag fmt

  swagger:clean:
    desc: Clean generated swagger files
    cmds:
      - rm -f internal/docs/docs.go internal/docs/swagger.json
        internal/docs/swagger.yaml

  db:migrate:
    desc: Run database migrations
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}} db migrate

  test:
    desc: Run all tests
    cmds:
      - go test ./... -v

  vet:
    desc: Run go vet across all packages
    cmds:
      - go vet ./...

  test:filter:
    desc: "Run tests matching a pattern (usage: task test:filter -- -run
      TestPattern)"
    cmds:
      - go test ./... -v {{.CLI_ARGS}}
      - task: swagger:generate
      - task: rebuild
      - echo ""
      - echo "Rebuild complete! Restart the server to pick up changes"

  dash:dev:
    desc: Start the dashboard dev server (proxies /v1 to localhost:8080)
    cmds:
      - pnpm --dir web dev

  dash:build:
    desc: Build the dashboard as a static SPA
    cmds:
      - pnpm --dir web build

  update:path:
    deps:
      - build:cli
      - build:etl
    desc: Update the PATH to include the build directory for easy CLI access
    cmds:
      - cp {{.BUILD_DIR}}/{{.BINARY_NAME}} /usr/local/bin/{{.BINARY_NAME}}
      - cp {{.BUILD_DIR}}/{{.ETL_BINARY_NAME}} /usr/local/bin/{{.ETL_BINARY_NAME}}
      - echo "✓ Updated PATH with {{.BINARY_NAME}} and {{.ETL_BINARY_NAME}} from {{.BUILD_DIR}}"
